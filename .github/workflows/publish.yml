name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version in package.json to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Check the requested version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$version" != "$REQUESTED_VERSION" ]; then
            echo "Requested version must match package.json ($version)."
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Publish with provenance
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
